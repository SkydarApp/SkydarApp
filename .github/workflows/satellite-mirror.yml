# Mirrors CelesTrak's satellite orbits and Launch Library 2's upcoming launches for the Skydar app.
#
# CelesTrak allows each internet address one download per data update (every 2 hours). Phones on cellular share
# addresses with thousands of others, so the app was often refused. This downloads each group once per update and
# publishes it as assets on the "satellite-data" release, which the app reads with no per-address limit.
# Only the fields the app uses are kept, compressed with raw DEFLATE (Starlink: 4.7 MB ‚Üí ~0.5 MB).
#
# Launch Library 2 (The Space Devs) allows 15 requests an hour per address and asks apps to cache rather than have
# every phone query it; launches are fetched once an hour and trimmed to what Skydar shows.

name: Satellite data mirror

on:
  schedule:
    - cron: "20 * * * *"   # hourly for launches; CelesTrak (updates every 2 hours) on even hours only
  workflow_dispatch:

permissions:
  contents: write   # publish release assets
  actions: write    # keep this schedule from being paused for inactivity

concurrency:
  group: satellite-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download orbits and launches
        run: |
          mkdir -p out
          python3 - <<'EOF'
          import datetime, json, os, urllib.request, zlib

          def publish(name, payload):
              compact = json.dumps(payload, separators=(",", ":")).encode()
              deflate = zlib.compressobj(9, zlib.DEFLATED, -15)
              data = deflate.compress(compact) + deflate.flush()
              with open(f"out/{name}.json.deflate", "wb") as f:
                  f.write(data)
              return len(data)

          UA = {"User-Agent": "SkydarMirror/1.0 (+https://skydarapp.github.io/SkydarApp/)"}

          # Launches: every run.
          try:
              url = "https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=100&mode=detailed"
              results = json.loads(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read())["results"]
              launches = []
              for l in results:
                  pad = l.get("pad") or {}
                  if pad.get("latitude") is None or pad.get("longitude") is None:
                      continue
                  mission = l.get("mission") or {}
                  rocket = ((l.get("rocket") or {}).get("configuration") or {})
                  videos = sorted(l.get("vid_urls") or [], key=lambda v: v.get("priority") or 99)
                  launches.append({
                      "id": l["id"],
                      "mission": mission.get("name") or l.get("name"),
                      "rocket": rocket.get("full_name") or rocket.get("name"),
                      "provider": (l.get("launch_service_provider") or {}).get("name"),
                      "net": l.get("net"),
                      "precision": (l.get("net_precision") or {}).get("abbrev"),
                      "windowEnd": l.get("window_end"),
                      "status": (l.get("status") or {}).get("abbrev"),
                      "orbit": (mission.get("orbit") or {}).get("abbrev"),
                      "summary": (mission.get("description") or "")[:280],
                      "pad": pad.get("name"),
                      "site": (pad.get("location") or {}).get("name"),
                      "latitude": float(pad["latitude"]),
                      "longitude": float(pad["longitude"]),
                      "webcast": videos[0]["url"] if videos else None,
                  })
              size = publish("launches", {"fetched": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                                          "source": "Launch Library 2 by The Space Devs", "launches": launches})
              print(f"launches: {len(launches)}, {size:,} bytes")
          except Exception as error:
              print(f"launches: skipped ({error})")

          # Orbits: on even hours (or when run by hand), matching CelesTrak's 2-hour updates.
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and datetime.datetime.now(datetime.timezone.utc).hour % 2:
              raise SystemExit(0)

          KEYS = ["OBJECT_NAME", "OBJECT_ID", "NORAD_CAT_ID", "EPOCH", "MEAN_MOTION", "ECCENTRICITY",
                  "INCLINATION", "RA_OF_ASC_NODE", "ARG_OF_PERICENTER", "MEAN_ANOMALY", "BSTAR"]

          for group in ["stations", "visual", "starlink"]:
              url = f"https://celestrak.org/NORAD/elements/gp.php?GROUP={group}&FORMAT=json"
              request = urllib.request.Request(url, headers=UA)
              try:
                  body = urllib.request.urlopen(request, timeout=60).read()
                  records = json.loads(body)
                  assert isinstance(records, list) and records
              except Exception as error:
                  # CelesTrak answers "GP data has not updated‚Ä¶" as plain text; keep the previous asset.
                  print(f"{group}: skipped ({error})")
                  continue
              size = publish(group, [{k: r[k] for k in KEYS if k in r} for r in records])
              print(f"{group}: {len(records)} satellites, {size:,} bytes")
          EOF

      - name: Publish to the satellite-data release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! ls out/*.deflate >/dev/null 2>&1; then echo "Nothing new to publish"; exit 0; fi
          gh release view satellite-data >/dev/null 2>&1 || \
            gh release create satellite-data --title "Satellite data" --latest=false \
              --notes "Orbits from CelesTrak (every 2 hours) and launches from Launch Library 2 by The Space Devs (hourly), mirrored for the Skydar app. Updated automatically."
          gh release upload satellite-data out/*.deflate --clobber

      - name: Keep the schedule running
        # GitHub pauses scheduled workflows after 60 days without commits; re-enabling resets that clock.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/satellite-mirror.yml/enable" || true
